<div class="sn-bg"></div>
<div class="sn-inside">
  <!-- Photo des hôtes -->
  <figure class="sn-photo-frame">
    <span class="sn-photo-fallback">{{MONOGRAM}}</span>
    <img class="sn-photo" src="https://images.unsplash.com/photo-1522941471521-6ee21ec5cc26?w=1400&q=80&auto=format&fit=crop" alt="Les hôtes">

  <div class="sn-intro">

  </div>
</div>
