  </ul>
  <p class="cf-message" data-if="CUSTOM_MESSAGE">{{CUSTOM_MESSAGE}}</p>
  <div class="cf-rsvp" data-if="INVITE_QR">
    <div class="cf-qr">{{INVITE_QR}}</div>
    <p>Tu viens ?<br><span>Scanne le code pour répondre</span></p>
  </div>
  <p class="cf-contact" data-if="CONTACT_PHONE">{{CONTACT_PHONE}}</p>
</div>
