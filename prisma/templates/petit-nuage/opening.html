<!-- Ouverture -->
<div class="pno" data-opening data-opening-manual data-reveal-delay="0" data-remove-delay="900" role="dialog" aria-modal="true" aria-label="Grattez le ticket pour découvrir l'invitation">
  <div class="pno-sky" aria-hidden="true">
    <span class="pno-cloud pno-cloud--1"></span>
    <span class="pno-cloud pno-cloud--2"></span>
    <span class="pno-cloud pno-cloud--3"></span>
    <span class="pno-spark pno-spark--1"></span>
    <span class="pno-spark pno-spark--2"></span>
    <span class="pno-spark pno-spark--3"></span>
    <span class="pno-spark pno-spark--4"></span>
  </div>

  <div class="pno-card" data-card>
    <p class="pno-kicker">Une surprise pour</p>
    <p class="pno-name">{{GUEST_NAME}}</p>

    <div class="pno-zone" data-zone>
      <div class="pno-secret">
        <svg class="pno-secret-moon" viewBox="0 0 100 100" aria-hidden="true">
          <path class="pno-moon-body" d="M89.5 64.3A42 42 0 1 1 44.8 8.3A36 36 0 0 0 89.5 64.3Z"/>
          <path d="M26 54q5 5 10 0" fill="none" stroke="#3a3350" stroke-width="2.6" stroke-linecap="round"/>
          <circle cx="27" cy="66" r="5" fill="#f4b6a6" opacity=".8"/>
        </svg>
        <p class="pno-secret-title">Bébé arrive bientôt</p>
        <p class="pno-secret-text">et vous êtes invité(e) à sa toute première fête</p>
      </div>
      <canvas class="pno-foil" data-foil aria-hidden="true"></canvas>
    </div>

    <p class="pno-hint" data-hint aria-live="polite">Grattez la zone avec le doigt</p>
    <button type="button" class="pno-skip" data-skip>Découvrir sans gratter</button>
  </div>
</div>
