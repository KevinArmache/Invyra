<div class="sd-paper"></div>
<div class="sd-text">
  <p class="sd-guest" data-if="GUEST_NAME">Pour {{GUEST_NAME}}</p>
  <p class="sd-lead">Entourés de leurs familles,</p>
  <h2 class="sd-names sd-names--inside">{{EVENT_TITLE}}</h2>
  <p class="sd-body">ont la joie de vous convier à la célébration de leur mariage</p>
  <svg class="sd-divider" viewBox="0 0 60 6" data-finish="foil-gold" aria-hidden="true"><path d="M2 3 H25" stroke="currentColor" stroke-width="0.4"/><path d="M35 3 H58" stroke="currentColor" stroke-width="0.4"/><path d="M30 0.4 L32.6 3 L30 5.6 L27.4 3Z" fill="currentColor"/><circle cx="24" cy="3" r="0.8" fill="currentColor"/><circle cx="36" cy="3" r="0.8" fill="currentColor"/></svg>
  <p class="sd-when">{{EVENT_DATE}}</p>
  <p class="sd-time" data-if="TIME">à {{TIME}}</p>
  <p class="sd-where">{{LOCATION}}</p>
  <p class="sd-note" data-if="DRESS_CODE"><span>Tenue</span>{{DRESS_CODE}}</p>
  <p class="sd-message" data-if="CUSTOM_MESSAGE">{{CUSTOM_MESSAGE}}</p>
</div>
